<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECNO NOVA - Panel de Gestión de Catálogo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ============ ENCABEZADO ============ -->
    <header class="app-header">
        <div class="brand">
            <img src="img/logo-tecnonova.jpeg" alt="Logo TECNO NOVA" class="brand-logo">
            <div class="brand-text">
                <h1>TECNO NOVA</h1>
                <p>Tecnología para todos</p>
            </div>
        </div>
        <p class="evidence-tag">Evidencia: GA6-220501096-AA4-EV03 · Módulo: Catálogo de Productos</p>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"
                title="Cambiar entre modo claro y oscuro">
            <span class="theme-icon">&#127769;</span>
            <span class="theme-label">Modo oscuro</span>
        </button>
    </header>

    <main class="container">

        <!-- ============ SECCIÓN FORMULARIO (CREATE / UPDATE) ============ -->
        <section class="form-section" aria-labelledby="form-title">
            <h2 id="form-title">Registrar Nuevo Producto</h2>

            <form id="crud-form" novalidate>
                <input type="hidden" id="item-id">

                <div class="form-group">
                    <label for="item-name">Nombre del producto</label>
                    <input type="text" id="item-name" required minlength="3"
                           placeholder="Ej. Portátil Nova Pro 15”">
                    <small class="field-hint">Mínimo 3 caracteres.</small>
                </div>

                <div class="form-group">
                    <label for="item-category">Categoría</label>
                    <select id="item-category" required>
                        <option value="">Seleccione una categoría...</option>
                        <option value="Portatiles">Portátiles</option>
                        <option value="Celulares">Celulares</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="item-price">Precio (COP)</label>
                        <input type="number" id="item-price" required min="1" step="1000"
                               placeholder="Ej. 2500000">
                    </div>
                    <div class="form-group">
                        <label for="item-stock">Unidades disponibles</label>
                        <input type="number" id="item-stock" required min="0" step="1"
                               placeholder="Ej. 12">
                    </div>
                </div>

                <div class="form-group">
                    <label for="item-desc">Descripción / Especificaciones</label>
                    <textarea id="item-desc" rows="3" required minlength="5"
                              placeholder="Breve descripción técnica del producto..."></textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="btn-save" class="btn btn-success">Guardar Producto</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary hidden">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- ============ SECCIÓN CATÁLOGO (READ / UPDATE / DELETE) ============ -->
        <section class="list-section" aria-labelledby="catalog-title">
            <h2 id="catalog-title">Catálogo de Productos</h2>

            <!-- Barra de búsqueda -->
            <div class="search-bar">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input type="text" id="search-input" placeholder="Buscar producto por nombre...">
            </div>

            <!-- Filtros de categoría (chips) -->
            <div class="chip-filters" id="chip-filters" role="tablist" aria-label="Filtrar por categoría">
                <button class="chip active" data-category="Todas">Todas</button>
                <button class="chip" data-category="Portatiles">Portátiles</button>
                <button class="chip" data-category="Celulares">Celulares</button>
                <button class="chip" data-category="Accesorios">Accesorios</button>
            </div>

            <!-- Cuadrícula de tarjetas de producto -->
            <div class="product-grid" id="product-grid">
                <!-- Las tarjetas se renderizan dinámicamente con JS -->
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>SENA · Análisis y Desarrollo de Software · GA6-220501096-AA4-EV03 · Almacenamiento: LocalStorage</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
